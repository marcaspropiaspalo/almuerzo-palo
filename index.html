<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido almuerzo PALO</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --verde: #1D3527;
      --crema: #EDEBDF;
      --naranja: #E6451B;
      --naranja-hover: #C93A16;
      --bordo: #561028;
      --bordo-bg: #F4E9ED;
      --gris-texto: #5B5B54;
    }
    body { font-family: 'Inter', Arial, sans-serif; background: var(--crema); padding: 20px; color: var(--verde); }
    .card { background: #FFFFFF; border-radius: 14px; padding: 28px; max-width: 560px; margin: 0 auto; box-shadow: 0 2px 16px rgba(29,53,39,0.08); border: 1px solid #E4E1D2; }
    .logo-wrap { display: flex; justify-content: center; margin-bottom: 20px; }
    .logo { display: block; height: 64px; }
    h1 { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; color: var(--verde); font-size: 28px; margin-bottom: 4px; text-align: center; }
    .subtitulo { color: var(--gris-texto); font-size: 14px; margin-bottom: 24px; text-align: center; }
    .campo { margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--verde); margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #DAD6C4; border-radius: 6px; font-size: 14px; font-family: 'Inter', Arial, sans-serif; background: #FDFCF8; }
    input:focus, select:focus { outline: none; border-color: var(--verde); }
    .categoria { margin-bottom: 20px; }
    .categoria h3 { font-family: 'Inter', Arial, sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--verde); letter-spacing: 0.06em; margin-bottom: 10px; border-bottom: 2px solid var(--crema); padding-bottom: 6px; }
    .opcion { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid #ECE9DC; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
    .opcion:hover { border-color: var(--verde); background: #F6F5EE; }
    .opcion.seleccionado { border-color: var(--verde); background: var(--crema); }
    .opcion.sin-cupo { opacity: 0.4; cursor: not-allowed; }
    .nombre-plato { font-size: 14px; }
    .cupos { font-size: 12px; color: #9A9A8E; }
    .cupos.bajo { color: var(--naranja); font-weight: 700; }
    .acomp-section { background: #F6F5EE; border-radius: 8px; padding: 14px; margin-top: 8px; margin-bottom: 16px; }
    .acomp-section label { color: var(--verde); }
    .btn { width: 100%; padding: 14px; background: var(--naranja); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; letter-spacing: 0.02em; cursor: pointer; margin-top: 20px; transition: background 0.15s; }
    .btn:hover { background: var(--naranja-hover); }
    .btn:disabled { background: #C9C6B8; cursor: not-allowed; }
    .msg { padding: 14px; border-radius: 8px; margin-top: 16px; font-size: 14px; text-align: center; }
    .msg.error { background: var(--bordo-bg); color: var(--bordo); }
    .flex-badge { font-size: 10px; background: var(--verde); color: white; padding: 2px 8px; border-radius: 10px; margin-left: 8px; letter-spacing: 0.02em; }
    .loading { text-align: center; padding: 40px; color: var(--gris-texto); }
  </style>
</head>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyPu_1wYNIeztCk1ySIiiD52lzvYc6g9vjeORWfwd1W38ZAwZOYWdu3JxXnHpmxpwVr/exec';

  let categorias = [];
  let acompMap = {};
  let seleccionados = [];

  fetch(SCRIPT_URL + '?action=getDatosEmpleados')
    .then(r => r.json())
    .then(datos => {
      categorias = datos.categorias;
      acompMap = datos.acompMap;
      document.getElementById('subtitulo').innerHTML = 'Palitos, hoy pedimos a <strong>' + (datos.local || 'Sin local asignado') + '</strong>';

      document.getElementById('btnEnviar').disabled = false;
    })
    .catch(() => {
      document.getElementById('menu').innerHTML = '<p style="color:#561028">Error cargando el menu. Recarga la pagina.</p>';
    });

  function renderMenu() {
    const container = document.getElementById('menu');
    container.innerHTML = '';
    for (const cat of categorias) {
      const esFlex = FLEX_CATS.includes(cat.nombre);
      const div = document.createElement('div');
      div.className = 'categoria';
      div.innerHTML = '<h3>' + cat.nombre + (esFlex ? '<span class="flex-badge">hasta 2</span>' : '') + '</h3>';
      for (const p of cat.platos) {
        const sinCupo = p.cupos <= 0;
        const opcion = document.createElement('div');
        opcion.className = 'opcion' + (sinCupo ? ' sin-cupo' : '');
        opcion.dataset.plato = p.plato;
        opcion.dataset.cat = cat.nombre;
        opcion.dataset.tipo = p.tipo;
        opcion.dataset.acomp = p.tieneAcomp;
        const cuposTxt = sinCupo ? 'Sin cupos' : (p.cupos <= 2 ? 'Ultimos ' + p.cupos + ' cupos' : p.cupos + ' cupos');
        const cuposClass = p.cupos <= 2 && !sinCupo ? 'bajo' : '';
        opcion.innerHTML = '<span class="nombre-plato">' + p.plato + '</span><span class="cupos ' + cuposClass + '">' + cuposTxt + '</span>';
        if (!sinCupo) opcion.onclick = () => toggleSeleccion(opcion);
        div.appendChild(opcion);
      }
      container.appendChild(div);
    }
    renderAcomp();
  }

  function toggleSeleccion(opcion) {
    const plato = opcion.dataset.plato;
    const cat = opcion.dataset.cat;
    const esFlex = FLEX_CATS.includes(cat);
    const yaSeleccionado = opcion.classList.contains('seleccionado');
    if (yaSeleccionado) {
      opcion.classList.remove('seleccionado');
      seleccionados = seleccionados.filter(s => s.plato !== plato);
    } else {
      const flexSel = seleccionados.filter(s => FLEX_CATS.includes(s.categoria));
      const singleSel = seleccionados.filter(s => !FLEX_CATS.includes(s.categoria));
      if (!esFlex && singleSel.length > 0) { mostrarMsg('Solo podes elegir 1 plato de las categorias principales.'); return; }
      if (!esFlex && flexSel.length > 0) { mostrarMsg('Si eleges un plato principal no podes combinar con desayunos, entradas o tostados.'); return; }
      if (esFlex && singleSel.length > 0) { mostrarMsg('Si eleges desayuno, entrada o tostado no podes combinar con platos principales.'); return; }
      if (esFlex && flexSel.length >= 2) { mostrarMsg('Podes elegir maximo 2 items del grupo flex.'); return; }
      opcion.classList.add('seleccionado');
      seleccionados.push({ plato, categoria: cat, tipo: opcion.dataset.tipo, tieneAcomp: opcion.dataset.acomp === 'true' });
    }
    renderAcomp();
  }

  function renderAcomp() {
    document.querySelectorAll('.acomp-section').forEach(e => e.remove());
    for (const sel of seleccionados) {
      if (!sel.tieneAcomp) continue;
      const opciones = acompMap[sel.plato] || [];
      if (!opciones.length) continue;
      const div = document.createElement('div');
      div.className = 'acomp-section';
      let opts = opciones.map(a => '<option value="' + a + '">' + a + '</option>').join('');
      div.innerHTML = '<label>Acompañamiento para ' + sel.plato + '</label><select id="acomp_' + btoa(unescape(encodeURIComponent(sel.plato))) + '"><option value="">-- Elegi un acompañamiento --</option>' + opts + '</select>';
      document.getElementById('menu').appendChild(div);
    }
  }

  function mostrarMsg(texto) {
    const msg = document.getElementById('msg');
    msg.className = 'msg error';
    msg.textContent = texto;
    setTimeout(() => { msg.textContent = ''; msg.className = ''; }, 4000);
  }

  async function enviarPedido() {
    const nombre = document.getElementById('nombre').value.trim();
    if (!nombre) { mostrarMsg('Por favor completa tu nombre.'); return; }
    if (!seleccionados.length) { mostrarMsg('Por favor elegi al menos un plato.'); return; }
    const items = seleccionados.map(sel => {
      const key = btoa(unescape(encodeURIComponent(sel.plato)));
      const acompEl = document.getElementById('acomp_' + key);
      return { plato: sel.plato, categoria: sel.categoria, tipo: sel.tipo, acompaniamiento: acompEl ? acompEl.value : '' };
    });
    for (const item of items) {
      if (item.acompaniamiento === '' && acompMap[item.plato] && acompMap[item.plato].length > 0) {
        mostrarMsg('Por favor elegi un acompañamiento para ' + item.plato); return;
      }
    }
    const btn = document.getElementById('btnEnviar');
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    try {
      const data = encodeURIComponent(JSON.stringify({ nombre, items }));
      const res = await fetch(SCRIPT_URL + '?action=procesarPedido&data=' + data);
      const result = await res.json();
      if (result.ok) {
        document.querySelector('.card').innerHTML = '<div style="text-align:center;padding:40px 0"><div style="font-size:48px">✅</div><h2 style="font-family:\'Instrument Serif\',Georgia,serif;font-style:italic;color:#1D3527;margin-top:16px;font-size:26px">Pedido confirmado!</h2><p style="color:#5B5B54;margin-top:8px">Tu pedido ya quedo registrado.</p></div>';
      } else {
        mostrarMsg(result.mensaje);
        btn.disabled = false;
        btn.textContent = 'Confirmar pedido';
      }
    } catch(err) {
      mostrarMsg('Error al enviar. Intenta de nuevo.');
      btn.disabled = false;
      btn.textContent = 'Confirmar pedido';
    }
  }
</script>
</body>
</html>
